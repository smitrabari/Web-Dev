<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        background-color: aliceblue;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        background-color: ghostwhite;
        border-radius: 8px;
        border: 1px solid black;
        padding: 30px;
        width: 300px;
      }

      h3 {
        color: gray;
        margin: 2px;
      }

      h2 {
        font-size: 40px;
        margin-top: 0px;
      }

      form {
        display: flex;
        flex-direction: column;
        margin-top: 0px;
        gap: 3px;
      }

      input {
        padding: 5px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 16px;
      }

      .button {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      button {
        padding: 5px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button:hover {
        background-color: lightgray;
      }

      .backup {
        display: flex;
        font-size: smaller;
        justify-content: space-between;
        align-items: center;
        margin: 10px;
        font-weight: bold;
      }

      h4 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Please enter your details</h3>
      <h2>Welcome back</h2>
      <form>
        <input type="email" placeholder="Email adress" />
        <input type="password" placeholder="Password" />
      </form>
      <div class="backup">
        <div><input type="checkbox" /><span>Remember me</span></div>
        <a href="#">Forgot password</a>
      </div>
      <div class="button">
        <button type="submit">Create Account</button>
        <button type="submit" style="gap: 6px">
          <img src="google.png" alt="google logo" width="20" height="20" />
          Sign in with Google
        </button>
      </div>

      <h4>Don't have an account? <a href="sign.html">Sign up</a></h4>
    </div>
  </body>
</html>
