<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      .grid-container {
        display: grid;
        /* grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 50px 150px; */

        /* gtc as shortcut */
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 200px);
        /* gap between the card  */
        gap: 20px;
      }
      .item {
        background-color: orange;
        border: 2px solid black;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        text-align: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        font-size: larger;
        padding: 3px;
      }

      .items-1 {
        /* gr is the shortcut  */
        grid-row: 1/3;
      }

      .items-6 {
        /* gc is the shortcut  */
        grid-column: 1/5;
      }
      .items-5 {
        grid-column: 2/5;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="item items-1">1</div>
      <div class="item items-2">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item items-5">5</div>
      <div class="item items-6">6</div>
    </div>
  </body>
</html>
