<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAVBAR</title>
    <style>
      body {
        background-color: black;
      }
      .Nav-container {
        margin: 0;
        padding: 10px;
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 5px;
      }

      .nav1 {
        background-color: whitesmoke;
        color: white;
        margin: 0;
        padding: 2px;
        border-radius: 8px;
      }

      .nav1 ul {
        list-style-type: none;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-weight: bold;
      }

      .nav1 li {
        display: inline;
      }

      .nav1 a {
        text-decoration: none;
        color: black;
        padding: 5px 15px;
        /* background-color: #bab3b3; */
        border-radius: 8px;
        position: relative;
      }

      .nav1 a::after {
        content: "";
        position: absolute;
        height: 3px;
        width: 100%;
        bottom: 0;
        left: 0;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
        background-color: #0a65c7;
        border-radius: 3px;
      }

      .nav1 a:hover::after {
        transform: scaleX(1);
      }
      .Contact-us {
        background-color: #0a65c7;
        color: white;
        padding: 5px 15px;
        border-radius: 8px;
        font-weight: bold;
        border: none;
        font-size: large;
        cursor: pointer;
      }

      .nav2 {
        background-color: yellowgreen;
        width: 300px;
        border-radius: 5px;
      }

      .nav2 ul {
        list-style-type: none;
        padding: 0;
        width: 100%;
      }

      .nav2 li {
        font-weight: bold;
        margin-bottom: 2px;
        padding: 1px 4px;
        color: white;
        text-align: center;
      }

      .nav2 a {
        display: block;
        text-decoration: none;
        padding: 5px 15px;
        color: white;
      }

      .nav2 a:hover {
        background-color: #1c7946;
        border-radius: 5px;
      }

      .nav2 button {
        padding: 5px 15px;
        width: 100%;
        border: none;
        font-weight: bold;
        background-color: #1c7946;
        border-radius: 5px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="Nav-container">
      <nav class="nav1">
        <ul>
          <li><a href="#">About us</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Services</a></li>
          <button type="submit" class="Contact-us">Contact us</button>
        </ul>
      </nav>
      <div class="nav2">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Search</a></li>
          <li><a href="#">Contact</a></li>
          <li><button type="submit">Login</button></li>
        </ul>
      </div>
    </div>
  </body>
</html>
