<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAVBAR</title>
    <style>
      body {
        background-color: grey;
      }
      .Nav-container {
        margin: 0;
        padding: 10px;
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 5px;
      }

      .nav1 {
        background-color: black;
        color: white;
        margin: 0;
        padding: 2px;
        border-radius: 8px;
      }

      .nav1 ul {
        list-style-type: none;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-weight: bold;
      }

      ul li {
        display: inline;
      }

      .nav1 a {
        text-decoration: none;
        color: black;
        padding: 5px 15px;
        background-color: yellow;
        border-radius: 8px;
      }

      .Contact-us {
        background-color: #0a65c7;
        color: white;
        padding: 5px 15px;
        border-radius: 8px;
        font-weight: bold;
        border: none;
        font-size: large;
      }
    </style>
  </head>
  <body>
    <div class="Nav-container">
      <nav class="nav1">
        <ul>
          <li><a href="#">About us</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Services</a></li>
          <button type="submit" class="Contact-us">Contact us</button>
        </ul>
      </nav>
    </div>
  </body>
</html>
