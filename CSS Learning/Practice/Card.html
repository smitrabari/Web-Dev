<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap");
      body,
      html {
        margin: 0;
        padding: 0;
        background-color: rgb(27, 26, 26);
        height: 100%;
        width: 100%;
        font-family: "Inconsolata", monospace;
      }
      .container {
        /* border: 2px solid red; */
        display: grid;
        grid-template-areas: "smit inflictt alex";
        margin: 0px;
        justify-content: center;
        align-items: center;
        gap: 70px;
        padding: 50px;
        height: 100%;
      }

      .container .card {
        /* border: 2px solid red; */
        display: grid;
        justify-content: center;
        align-items: center;
        border-radius: 18px;
        padding: 30px;
        background-color: beige;
        width: fit-content;
      }

      @media (max-width: 575px) {
        body,
        html {
          width: 575px;
          display: grid;
          grid-template-areas: "smit" "inflictt" "alex";
        }
      }

      .card img {
        width: 300px;
        box-shadow: 0px 8px 6px -6px rgba(0, 0, 0, 0.3);
      }

      .card h1 {
        font-size: 50px;
        margin: 0px;
        padding: 0px;
        color: forestgreen;
      }

      .card h3 {
        margin: 0px;
        font-weight: bold;
      }

      .card p {
        margin: 0px;
        padding: 20px 0px 0px 0px;
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card" style="grid-area: smit">
        <img src="Pixel type Art.png" alt="my pfp" />
        <h1>Smit Rabari</h1>
        <h3>Software Engineer @ Google</h3>
        <p>
          smitrabari18@gmail.com <br />
          +91 1234567890
        </p>
      </div>
      <div class="card" style="grid-area: inflictt">
        <img src="Inflictt.jpg" alt="inflictt pfp" />
        <h1>Inflictt</h1>
        <h3>Software Engineer @ Google</h3>
        <p>
          inflictt@gmail.com <br />
          +91 1234567890
        </p>
      </div>
      <div class="card" style="grid-area: alex">
        <img src="Alex Carter.png" alt="Alex Carter pfp" />
        <h1>Alex Carter</h1>
        <h3>Software Engineer @ Google</h3>
        <p>
          alexcarter@gmail.com <br />
          +91 1234567890
        </p>
      </div>
    </div>
  </body>
</html>
