<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>
      <form>
        <label for="email">
          email:
          <input placeholder="Email" type="text" name="email" />
        </label>
        <br />
        <label for="password">
          password:
          <input
            placeholder="Please enter your password"
            type="password"
            name="password"
          />
        </label>
        <br />
        <button type="submit">Login</button>
      </form>
    </h1>
  </body>
</html>
