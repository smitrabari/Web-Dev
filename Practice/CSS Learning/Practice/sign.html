<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        background-color: aliceblue;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        background-color: ghostwhite;
        border-radius: 8px;
        border: 1px solid black;
        padding: 30px;
        width: 300px;
      }

      h3 {
        color: gray;
        margin: 2px;
      }

      h2 {
        font-size: 40px;
        margin-top: 0px;
      }

      form {
        display: flex;
        margin-top: 0px;
        gap: 3px;
        flex-direction: column;
      }

      input {
        padding: 5px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 16px;
      }

      .button {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 15px;
      }

      button {
        padding: 5px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
      }

      h4 {
        text-align: center;
      }

      .info {
        display: flex;
        gap: 5px;
      }

      .info input {
        width: 50%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Please enter your details</h3>
      <h2>Create Account</h2>
      <form>
        <input
          type="email"
          placeholder="Email adress"
          style="flex-direction: column"
        />
        <div class="info">
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" />
        </div>
        <input
          type="password"
          placeholder="Password"
          style="flex-direction: column"
        />
      </form>

      <div class="button">
        <button type="submit">Create Account</button>
        <button type="submit">Sign in with Google</button>
      </div>

      <h4>have an account? <a href="login.html">Login</a></h4>
    </div>
  </body>
</html>
